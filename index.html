<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyGroup Academy | Interactive GCSE Learning & Collaboration</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- PDF.js for Client-Side PDF Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

  <!-- Lucide Icons & Tailwind CSS -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
            sparx: { 400: '#38bdf8', 500: '#06b6d4', 600: '#0891b2' }
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased">

  <!-- Header Navigation -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-6">
        <a href="#/dashboard/student" class="flex items-center gap-2">
          <img src="assets/Logo.png" alt="Logo" class="w-8 h-8 rounded-lg object-contain bg-slate-800 p-1 border border-slate-700" onerror="this.style.display='none'">
          <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
            StudyGroup <span class="text-brand-500">Academy</span>
          </span>
        </a>

        <!-- Global Search -->
        <div class="relative hidden md:block w-64">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="global-search" placeholder="Search friends, notes, subjects..." class="w-full bg-slate-950/80 border border-slate-800 rounded-full pl-9 pr-4 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-brand-500 transition" oninput="handleGlobalSearch(this.value)">
          <div id="search-results" class="hidden absolute left-0 right-0 top-11 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl p-2 z-50 max-h-80 overflow-y-auto"></div>
        </div>
      </div>

      <!-- Nav Links -->
      <nav class="hidden lg:flex items-center gap-1 text-sm font-medium">
        <a href="#/dashboard/student" class="px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-2"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Student Portal</a>
        <a href="#/dashboard/teacher" class="px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-2"><i data-lucide="graduation-cap" class="w-4 h-4"></i> Teacher Portal</a>
        <a href="#/zip-maths" class="px-3 py-2 rounded-lg hover:bg-slate-800 text-sparx-400 hover:text-white transition flex items-center gap-2"><i data-lucide="zap" class="w-4 h-4 font-bold"></i> Zip Learning</a>
        <a href="#/content" class="px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4"></i> GCSE Content</a>
        <a href="#/messages" class="px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-2 relative">
          <i data-lucide="message-square" class="w-4 h-4"></i> Direct Messages
        </a>
        <a href="#/calendar" class="px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4"></i> Planner</a>
      </nav>

      <!-- Auth Controls -->
      <div id="auth-controls" class="flex items-center gap-3">
        <!-- Rendered by JS -->
      </div>
    </div>
  </header>

  <!-- Viewport -->
  <main id="app-viewport" class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
    <!-- Dynamic views -->
  </main>

  <footer class="border-t border-slate-800 bg-slate-900/50 py-6 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <p>&copy; 2026 StudyGroup Academy. Comprehensive Secondary & GCSE Learning Platform.</p>
      <div class="flex items-center gap-4">
        <a href="#/dashboard/student" class="hover:underline">Student Dashboard</a>
        <a href="#/dashboard/teacher" class="hover:underline">Teacher Dashboard</a>
        <a href="#/school-register" class="hover:underline">School Portal Sign Up</a>
      </div>
    </div>
  </footer>

  <!-- Core App Scripts -->
  <script src="core.js"></script>
  <script src="helpers.js"></script>
  <script src="dashboard.js"></script>
  <script src="notes.js"></script>
  <script src="leaderboard.js"></script>
  <script src="grades.js"></script>
  <script src="workspace.js"></script>
  <script src="app.js"></script>
</body>
</html>
